# The required gate. `ci-ok` is the one status check the branch ruleset requires, so jobs can be renamed
# without editing the ruleset. Every action is pinned by commit SHA (Renovate bumps them; zizmor checks).
# Every tool comes from mise.toml at the versions and checksums in mise.lock.
name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate from the pinned upstream commits and fail if the committed definitions differ.
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: definitions match upstream.toml
        run: mise exec -- lune run scripts/generate -- --check

  # The samples: tests/pass must type-check with zero diagnostics under --!strict, tests/fail must get
  # exactly the errors it expects. The generator itself must also pass --!strict.
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: samples
        run: mise exec -- lune run scripts/test
      - name: lune type definitions
        run: |
          mise exec -- lune setup
          version="$(mise exec -- lune --version | cut -d' ' -f2)"
          grep -q "\.typedefs/${version}/" .luaurc || { echo "::error file=.luaurc::alias must point at lune ${version} typedefs"; exit 1; }
      - name: generator is --!strict clean
        run: mise exec -- luau-lsp analyze --platform=standard --base-luaurc=.luaurc generator/ scripts/

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: stylua
        run: mise exec -- stylua --check .
      - name: selene
        run: mise exec -- selene .
      - name: typos
        run: mise exec -- typos

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:rhysd/actionlint
          cache: true
      - name: actionlint
        run: mise exec -- actionlint
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: low
          advanced-security: false
          annotations: true

  ci-ok:
    if: always()
    needs: [fresh, typecheck, lint, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: ok
        run: echo "fresh, typecheck, lint and workflows passed"
