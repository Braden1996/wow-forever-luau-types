# The required gate. `ci-ok` is the one status check the branch ruleset requires, so jobs can be renamed
# without editing the ruleset. Every action is pinned by commit SHA (Renovate bumps them; zizmor checks).
# Every tool comes from mise.toml at the versions and checksums in mise.lock. Type checks run on Luau's
# new type solver, which the definitions require.
name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate every generated file (definitions, report, coverage, banner) from the pinned upstream
  # commits and fail if a committed copy differs.
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: generated files match upstream.toml
        run: mise exec -- lune run scripts/generate -- --check

  # tests/pass must type-check with zero diagnostics, tests/fail must produce exactly its .expected
  # diagnostics, the converter must reproduce every snapshot, and the generator must be --!strict clean.
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: samples
        run: mise exec -- lune run scripts/test
      - name: converter snapshots
        run: mise exec -- lune run scripts/snapshot
      - name: lune type definitions
        run: |
          mise exec -- lune setup
          version="$(mise exec -- lune --version | cut -d' ' -f2)"
          grep -q "\.typedefs/${version}/" .luaurc || { echo "::error file=.luaurc::alias must point at lune ${version} typedefs"; exit 1; }
      - name: generator is --!strict clean
        run: mise exec -- luau-lsp analyze --platform=standard --flag:LuauSolverV2=true --base-luaurc=.luaurc generator/ scripts/

  # An API that was typed must not become untyped. Compares with the pull request's base branch, or
  # with the previous commit on a push to main.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: no typed API lost its types
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          git show "$base:definitions/coverage.json" > "$RUNNER_TEMP/base-coverage.json" 2>/dev/null || rm -f "$RUNNER_TEMP/base-coverage.json"
          mise exec -- lune run scripts/coverage-diff -- "$RUNNER_TEMP/base-coverage.json"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: stylua
        run: mise exec -- stylua --check .
      - name: selene
        run: mise exec -- selene .
      - name: typos
        run: mise exec -- typos

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:rhysd/actionlint
          cache: true
      - name: actionlint
        run: mise exec -- actionlint
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: low
          advanced-security: false
          annotations: true

  # The documentation site (docs/): strict TypeScript (tsgo and astro check), oxlint, oxfmt, unit tests, the
  # static build of every API page from definitions/, and an offline check of every internal link.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node
          cache: true
      - name: install
        run: mise exec -- bun install --frozen-lockfile
      - name: typecheck
        run: mise exec -- bun run typecheck
      - name: lint
        run: mise exec -- bun run lint
      - name: format
        run: mise exec -- bun run fmt:check
      - name: test
        run: mise exec -- bun run test
      - name: build
        run: mise exec -- bun run build
      - name: links
        run: mise exec -- bun run links

  ci-ok:
    if: always()
    needs: [fresh, typecheck, coverage, lint, workflows, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: ok
        run: echo "fresh, typecheck, coverage, lint, workflows and docs passed"
