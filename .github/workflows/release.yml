name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          seal-sysctl: true
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses]
      - uses: ./.github/actions/setup-workspace # zizmor: ignore[self-repository]
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0 # zizmor: ignore[unpinned-uses]

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses]
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses]
      - name: Pack the definitions and metadata
        id: pack
        run: |
          archive=".sergeant/release/wow-forever-luau-types-${GITHUB_REF_NAME#v}.zip"
          woof pack --out "$archive" \
            --include definitions/api-shapes.json \
            --include definitions/luau-lsp.settings.json \
            --include definitions/report.json \
            --include definitions/coverage.json \
            --include definitions/COVERAGE.md \
            --include LICENSE --include README.md --include CHANGELOG.md
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: Braden1996/sergeant-releases/actions/release-woof@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          archive-path: ${{ steps.pack.outputs.archive }}
          extra-artifacts: |
            definitions/wow-forever.d.luau
            definitions/report.json
            definitions/coverage.json
            definitions/api-shapes.json
            definitions/COVERAGE.md
            definitions/luau-lsp.settings.json
