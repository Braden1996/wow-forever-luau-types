# Builds the documentation site (docs/) and deploys it to GitHub Pages from main. Fully static: the API reference is
# generated from definitions/ at build time. The ci workflow runs the same build, plus every check, on pull requests.
# No dependency cache here: the published site is built from a clean install (zizmor cache-poisoning).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "definitions/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: bun node
          cache: false
      - name: install
        working-directory: docs
        run: mise exec -- bun install --frozen-lockfile
      - name: build
        working-directory: docs
        run: mise exec -- bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
