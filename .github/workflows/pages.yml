name: pages

on:
  push:
    branches: [main]
    paths:
      - "packages/runtimes/docs/**"
      - "definitions/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "bun.lock"
      - "sergeant.jsonc"
      - "tsconfig.base.json"
      - "mise.*"
      - ".github/actions/setup-workspace/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          seal-sysctl: true
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses]
      - uses: ./.github/actions/setup-workspace # zizmor: ignore[self-repository]
      - name: Install workspace dependencies
        run: sgt --no-daemon install --frozen
      - uses: Braden1996/sergeant-releases/actions/deploy-astro-pages@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          unit: packages/runtimes/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
