name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # GITHUB_TOKEN does not trigger the normal pull_request event for the automated upstream bump.
  workflow_dispatch:
    inputs:
      title:
        description: The automated upstream pull request title
        required: true
        type: string

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: Braden1996/sergeant-releases/actions/pr-title@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          scopes: generator,definitions,upstream,supplements,template,tests,ci,docs,deps,repo,tools
      - name: Validate the automated upstream title
        if: github.event_name == 'workflow_dispatch'
        env:
          TITLE: ${{ inputs.title }}
        run: |
          test "$TITLE" = 'feat(upstream): move upstream pins to their branch heads'
