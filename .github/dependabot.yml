# Dependabot keeps the docs site's npm packages (docs/, Bun) current. Tools are pinned in mise.toml (bump by hand,
# then `mise lock`).
version: 2
updates:
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: time for a compromised or broken version to be pulled.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["oxlint", "oxfmt", "tsrs", "typescript", "@types/*"]
    commit-message:
      prefix: build
      include: scope
