# Dependabot keeps the docs site's npm packages (docs/, Bun) current. Tools are pinned in mise.toml (bump by hand,
# then `mise lock`).
version: 2
updates:
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["oxlint", "oxlint-tsgolint", "oxfmt", "typescript", "@typescript/native", "@types/*"]
    commit-message:
      prefix: build
      include: scope
