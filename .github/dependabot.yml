# Dependabot keeps the SHA-pinned GitHub Actions current. Tools are pinned in mise.toml (bump by hand, then
# `mise lock`); the three upstream sources are bumped by the scheduled `upstream` workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let a release age a week before adopting it
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # One scope for every ecosystem: `include: scope` writes `deps-dev`, which pr-title rejects.
      prefix: build(deps)
  # The docs site's npm packages (docs/, Bun).
  - package-ecosystem: bun
    directory: /docs
    ignore:
      # astro check refuses TypeScript 7; the site gets 7 as @typescript/native and keeps 6 for astro check.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let a release age a week before adopting it
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["oxlint", "oxfmt", "tsrs", "typescript", "@types/*"]
    commit-message:
      prefix: build(deps)
  # The addon template's own workflow, which users copy.
  - package-ecosystem: github-actions
    directory: /templates/addon
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let a release age a week before adopting it
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
