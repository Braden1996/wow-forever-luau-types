<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">wow-forever-luau-types</title>
  <desc id="desc">Strict Luau type definitions for the World of Warcraft: Forever API</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="0.55" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#1d1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00a2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="250" cy="200" r="230" fill="url(#glow)"/>

  <!-- Emblem: a Luau-style tilted square inside a rune ring. -->
  <g transform="translate(250 200)">
    <circle r="132" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.85"/>
    <circle r="118" fill="none" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 10"/>
    <g fill="url(#gold)" fill-opacity="0.9">
      <path d="M0 -150 L7 -136 L0 -122 L-7 -136 Z"/>
      <path d="M0 150 L7 136 L0 122 L-7 136 Z"/>
      <path d="M-150 0 L-136 7 L-122 0 L-136 -7 Z"/>
      <path d="M150 0 L136 7 L122 0 L136 -7 Z"/>
    </g>
    <g transform="rotate(-15)">
      <rect x="-70" y="-70" width="140" height="140" rx="10" fill="url(#blue)"/>
      <rect x="22" y="-58" width="36" height="36" rx="4" fill="#0b1022"/>
    </g>
    <text x="-6" y="30" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="54" font-weight="700" fill="#0b1022" text-anchor="middle">: T</text>
  </g>

  <!-- Wordmark. -->
  <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text x="470" y="168" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">wow-forever-luau-types</text>
    <text x="472" y="216" font-size="25" fill="#c7d2fe">Strict Luau type definitions for the World of Warcraft: Forever API</text>
  </g>

  <!-- A typed line of addon code. -->
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="22">
    <rect x="470" y="252" width="560" height="64" rx="10" fill="#0b1022" fill-opacity="0.75" stroke="#2f6bff" stroke-opacity="0.5"/>
    <text x="494" y="292"><tspan fill="#c678dd">local</tspan><tspan fill="#e5e7eb"> frame</tspan><tspan fill="#9ca3af">: </tspan><tspan fill="#5ec8ff">Frame</tspan><tspan fill="#9ca3af"> = </tspan><tspan fill="#ffe7a3">CreateFrame</tspan><tspan fill="#e5e7eb">(</tspan><tspan fill="#98c379">"Frame"</tspan><tspan fill="#e5e7eb">)</tspan></text>
  </g>
</svg>
