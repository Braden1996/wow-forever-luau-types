name: Set up workspace tools
description: Install the pinned docs and check tools, and provision the Bun workspace's local preset tarballs.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        cache: false
        install_args: bun node aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:koalaman/shellcheck aqua:lycheeverse/lychee aqua:gitleaks/gitleaks github:seaofvoices/darklua
    - name: Prepare preset tarballs and Lune typedefs
      shell: bash
      run: |
        mkdir -p ../sergeant/dist/npm
        npm pack --pack-destination ../sergeant/dist/npm \
          @sgt-build/tsconfig@0.15.0 \
          @sgt-build/oxlint-config@0.15.0 \
          @sgt-build/oxlint-config-react@0.15.0
        lune setup
