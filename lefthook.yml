# Git hooks. Install once: `mise exec -- lefthook install`. Pre-commit stays fast and needs no generation; pre-push
# runs the Sergeant gate. Tools run through `mise exec --` (pinned versions).
# Never bypass with --no-verify.
min_version: 2.0.0

pre-commit:
  parallel: true
  jobs:
    - name: stylua
      glob: "*.luau"
      exclude:
        - "**/*.d.luau"
        - "definitions/**"
        - "tests/snapshots/**"
      run: mise exec -- stylua --check {staged_files}
    - name: typos
      run: mise exec -- typos --force-exclude {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: mise exec -- actionlint {staged_files}

pre-push:
  jobs:
    - name: check
      run: mise exec -- sgt check && mise exec -- sgt test
