$schema: "./.moon/cache/schemas/project.json"

# Project `repo`: whole-tree checks. `cache: false`: they are cheap and must see the whole tree. Each task names its
# inputs anyway: the root project has no default file inputs, and `--affected` (the pre-push hook) uses them.
layer: "configuration"
tags: ["repo"]

taskOptions:
  shell: false
  cache: false
  runFromWorkspaceRoot: true

tasks:
  typos:
    description: "Spelling (_typos.toml)"
    command: "typos"
    inputs: ["/**/*"]
  actionlint:
    description: "GitHub workflow lint (this repository's workflows and the addon template's)"
    command: "actionlint"
    args: [
      ".github/workflows/ci.yml",
      ".github/workflows/pages.yml",
      ".github/workflows/pr-title.yml",
      ".github/workflows/release.yml",
      ".github/workflows/upstream.yml",
      "templates/addon/.github/workflows/check.yml",
    ]
    inputs: ["/.github/workflows/**/*", "/templates/**/.github/workflows/**/*"]
  zizmor:
    description: "GitHub Actions security audit (pinned actions, permissions, injection)"
    command: "zizmor"
    args: ["--offline", "--min-severity", "low", ".github", "templates/addon/.github"]
    inputs: ["/.github/**/*", "/templates/**/.github/**/*"]
  links:
    description: "Offline link check of every Markdown file"
    command: "lychee"
    args: [
      "--offline",
      "--include-fragments",
      "--no-progress",
      "./*.md",
      "./.github/**/*.md",
      "./definitions/*.md",
      "./templates/**/*.md",
      "./docs/src/**/*.md",
    ]
    inputs: ["/**/*.md"]
  fmt:
    description: "Format Markdown, JSON, YAML and TOML (dprint.json)"
    command: "dprint"
    args: ["fmt"]
  fmt-check:
    description: "dprint check: Markdown, JSON, YAML and TOML formatting (run `moon run repo:fmt` to fix)"
    command: "dprint"
    args: ["check"]
    inputs: ["/**/*.{md,json,yml,yaml,toml}", "/dprint.json"]
  check:
    description: "Aggregator: every repo-wide check"
    deps: ["~:typos", "~:actionlint", "~:zizmor", "~:links", "~:fmt-check"]
