# Lints the repository's own Luau (packages/generator). The WoW samples under tests/ use game
# globals selene does not know; luau-lsp checks them against the generated definitions instead.
std = "luau"
exclude = [
  ".upstream/*",
  ".sergeant/*",
  "luau_packages/*",
  "definitions/*",
  "supplements/*",
  "tests/*",
  "templates/*",
]
