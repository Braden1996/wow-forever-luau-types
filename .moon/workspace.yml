$schema: "./cache/schemas/workspace.json"

# moon workspace. `moon run :check` is THE gate: CI runs it cold (MOON_CACHE=write), and so does the pre-push hook
# (affected projects only). Conventions, as in the wider Speedline project:
# - no moon toolchain plugins: every task runs on the `system` toolchain and mise puts the pinned binaries on PATH;
# - every task is `shell: false` and runs from the workspace root (the scripts resolve paths from there);
# - each project has a `check` aggregator that only lists deps.
versionConstraint: "=2.6.5"

projects:
  repo: "."
  generator: "generator"
  tests: "tests"
  docs: "docs"

vcs:
  client: "git"
  provider: "github"
  defaultBranch: "main"

hasher:
  # Hash only files git knows about: the ignored .upstream/ cache and .moon/cache/ never feed a hash.
  walkStrategy: "vcs"
  warnOnMissingInputs: true

pipeline:
  cacheLifetime: "7 days"

telemetry: false
