$schema: "../.moon/cache/schemas/project.json"

# Project `generator`: the converter (generator/) and its command-line scripts (scripts/).
layer: "tool"
tags: ["luau"]

taskOptions:
  shell: false
  runFromWorkspaceRoot: true

tasks:
  generate:
    description: "Regenerate definitions/, the coverage report and the banner from upstream.toml (fetches into .upstream/)"
    command: "lune"
    args: ["run", "scripts/generate"]
    options:
      cache: false
  fresh:
    description: "Fail if any generated file differs from a regeneration from upstream.toml"
    command: "lune"
    args: ["run", "scripts/generate", "--", "--check"]
    inputs:
      - "/upstream.toml"
      - "/supplements/**/*"
      - "/definitions/**/*"
      - "/.github/banner.svg"
      - "/generator/**/*.luau"
      - "/scripts/generate.luau"
    options:
      cache: false
  coverage:
    description: "Fail if an API typed on the base ref is untyped now (base: $COVERAGE_BASE, default origin/main)"
    command: "lune"
    args: ["run", "scripts/coverage-diff"]
    inputs: ["/definitions/coverage.json", "/definitions/api-shapes.json", "/scripts/coverage-diff.luau", "/scripts/coverage-accepted.json"]
    options:
      cache: false
  luaurc:
    description: "The .luaurc `@lune` alias points at the type definitions of the pinned Lune version"
    command: "lune"
    args: ["run", "scripts/check-luaurc"]
    inputs: ["/.luaurc", "/mise.toml"]
  lune-types:
    description: "Write Lune's type definitions, which .luaurc's `@lune` alias points at"
    command: "lune"
    args: ["setup"]
    options:
      cache: false
  typecheck:
    description: "The generator, scripts and unit cases type-check under --!strict on Luau's new solver"
    command: "luau-lsp"
    args: [
      "analyze",
      "--platform=standard",
      "--flag:LuauSolverV2=true",
      "--base-luaurc=.luaurc",
      "generator/",
      "scripts/",
      "tests/unit/",
    ]
    deps: ["~:lune-types"]
    inputs: ["/generator/**/*.luau", "/scripts/**/*.luau", "/tests/unit/**/*.luau", "/.luaurc"]
  lint:
    description: "selene over the generator and scripts (selene.toml)"
    command: "selene"
    args: ["./generator", "./scripts", "./tests/unit"]
    inputs: ["/generator/**/*.luau", "/scripts/**/*.luau", "/tests/unit/**/*.luau", "/selene.toml"]
  fmt:
    description: "Format the generator and scripts with StyLua"
    command: "stylua"
    args: ["./generator", "./scripts", "./tests/unit"]
    options:
      cache: false
  fmt-check:
    description: "StyLua check of the generator and scripts (run `moon run generator:fmt` to fix)"
    command: "stylua"
    args: ["--check", "generator", "scripts", "tests/unit"]
    inputs: ["/generator/**/*.luau", "/scripts/**/*.luau", "/tests/unit/**/*.luau", "/stylua.toml"]
  check:
    description: "Aggregator: every generator check"
    deps: ["~:fresh", "~:coverage", "~:luaurc", "~:typecheck", "~:lint", "~:fmt-check"]
